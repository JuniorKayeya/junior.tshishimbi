keywords:
  - Cybersécurité
  - Cybersecurity
  - Network Administration
  - System Administration
  - Linux
  - Windows Server
  - Active Directory
  - Cisco
  - Networking
  - SOC
  - Security

# Paramètres d'affichage
show_downloads: false

# Google Analytics
# google_analytics: ""

# Exclure certains fichiers du build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
