title: "Junior Tshishimbi"
logo: /assets/img/profile.jpg

description: >
  Spécialiste en cybersécurité | Administration système & réseau |
  Passionné par la sécurité des infrastructures, les réseaux et les systèmes.

# URL du site GitHub Pages
url: "https://juniorkayeya.github.io"
baseurl: "/junior.tshishimbi"

# Informations GitHub
github:
  username: JuniorKayeya

# Informations personnelles
author:
  name: "Junior Tshishimbi"
  email: "kayeyajunior@gmail.com"
  location: "Kinshasa, République démocratique du Congo"

# Réseaux sociaux
social:
  linkedin: "junior-tshishimbi"
  github: "JuniorKayeya"

# Thème Jekyll
